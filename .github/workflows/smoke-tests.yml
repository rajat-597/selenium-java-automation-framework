  name: Selenium Smoke Tests

  on:
    push:
      branches:
        - master
    pull_request:
      branches:
        - master

  # Permissions required for GitHub Pages deployment
  permissions:
    contents: read
    pages: write
    id-token: write

  jobs:
    smoke-tests:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'

        # Install Allure CLI
        - name: Install Allure CLI
          run: npm install -g allure-commandline

        - name: Run Selenium Smoke Tests
          run: mvn clean test -DsuiteXmlFile=testng.xml -Dheadless=true
          env:
            LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
            LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

        - name: Upload Failure Screenshots
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: selenium-failure-screenshots
            path: screenshots/
            if-no-files-found: warn
            retention-days: 7

        - name: Upload Allure Results
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: allure-results
            path: target/allure-results/
            if-no-files-found: warn
            retention-days: 7

        # Generate HTML report
        - name: Generate Allure HTML Report
          if: always()
          run: allure generate target/allure-results --clean -o allure-report

        # Configure GitHub Pages
        - name: Configure GitHub Pages
          if: github.event_name == 'push' && github.ref == 'refs/heads/master'
          uses: actions/configure-pages@v5

        # Upload HTML report for Pages
        - name: Upload Allure Report to GitHub Pages
          if: github.event_name == 'push' && github.ref == 'refs/heads/master'
          uses: actions/upload-pages-artifact@v3
          with:
            path: allure-report

        # Deploy report
        - name: Deploy Allure Report
          if: github.event_name == 'push' && github.ref == 'refs/heads/master'
          id: deployment
          uses: actions/deploy-pages@v4
